databases:
  - name: joineazy-db
    databaseName: joineazy
    user: joineazy
    plan: free

services:
  - type: web
    name: joineazy-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: CLIENT_URL
        value: https://joineazy-app.onrender.com
