services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: joineazy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - joineazy_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d joineazy"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/joineazy
      JWT_SECRET: replace_with_a_long_random_secret
      ADMIN_REGISTRATION_CODE: JOINEAZY-ADMIN-2026
      CLIENT_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  joineazy_pgdata:
